name: CoinAnk BTC/ETH Recorder

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: coinank-btc-eth-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run single capture into SQLite
        env:
          COINANK_ONCE: "1"
          COINANK_SKIP_EXCEL: "1"
        run: node tests/coinank_btc_eth_recorder.cjs

      - name: Commit updated coinank.db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore coinank.db
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore: record CoinAnk BTC/ETH snapshot"
            git pull --rebase --autostash origin HEAD
            git push
          fi
